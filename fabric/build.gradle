plugins {
    id "net.fabricmc.fabric-loom"
}

base {
    archivesName = rootProject.archives_base_name + "-fabric"
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://repo.sleeping.town/" }
    maven { url = "https://maven.is-quite.gay/" }
}

configurations {
    bundle
    implementation.extendsFrom(bundle)
}

sourceSets {
    main {
        java {
            srcDirs = ["src/main/java", "../common/src/main/java"]
        }
        resources {
            srcDirs = ["src/main/resources", "../common/src/main/resources"]
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    bundle("io.netty.incubator:netty-incubator-codec-classes-quic:${rootProject.quic_version}") {
        exclude(group: "io.netty")
    }
    bundle(files("../../../.tmp/e4mc_libs/iroh-java-1.0-SNAPSHOT.jar"))
    implementation("folk.sisby:kaleido-config:0.3.3+1.3.2")
    include("folk.sisby:kaleido-config:0.3.3+1.3.2")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

processResources {
    inputs.property "version", project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.bundle.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
